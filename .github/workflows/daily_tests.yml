name: Daily Appium Mobile Tests

on:
  schedule:
    # Runs every day at 8:00 AM UTC (11:00 AM local time)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI anytime!

jobs:
  test:
    timeout-minutes: 90
    runs-on: [appium-vm]

    steps:
      - name: Preserve Existing VM APK Before Checkout
        shell: bash
        run: |
          APK_VM_PATH="/opt/actions-runner-mobile/_work/Mobile_Automation_Testing/Mobile_Automation_Testing/app/app-uat-release.apk"
          if [ -f "$APK_VM_PATH" ]; then
            FILE_SIZE=$(stat -c%s "$APK_VM_PATH" 2>/dev/null || wc -c < "$APK_VM_PATH")
            if [ "$FILE_SIZE" -gt 1000000 ]; then
              echo "Found real APK ($FILE_SIZE bytes) at $APK_VM_PATH — backing up to /tmp/app-uat-release.apk before git checkout..."
              cp -f "$APK_VM_PATH" /tmp/app-uat-release.apk
            fi
          fi

      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Real APK at VM Path
        shell: bash
        run: |
          APK_VM_PATH="/opt/actions-runner-mobile/_work/Mobile_Automation_Testing/Mobile_Automation_Testing/app/app-uat-release.apk"
          mkdir -p "$(dirname "$APK_VM_PATH")"

          if [ -f "/tmp/app-uat-release.apk" ]; then
            echo "Restoring backed-up real APK to $APK_VM_PATH ..."
            cp -f /tmp/app-uat-release.apk "$APK_VM_PATH"
          fi

          if [ -f "$APK_VM_PATH" ]; then
            FILE_SIZE=$(stat -c%s "$APK_VM_PATH" 2>/dev/null || wc -c < "$APK_VM_PATH")
            echo "APK file at $APK_VM_PATH has size: $FILE_SIZE bytes"
          else
            echo "WARNING: APK not found at $APK_VM_PATH"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Ensure Android Emulator is Booted and Healthy
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          if [ ! -d "$ANDROID_HOME" ] && [ -d "/opt/android-sdk" ]; then
            export ANDROID_HOME="/opt/android-sdk"
          elif [ ! -d "$ANDROID_HOME" ] && [ -d "/usr/lib/android-sdk" ]; then
            export ANDROID_HOME="/usr/lib/android-sdk"
          fi
          export PATH="$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator"

          echo "Checking connected Android devices via ADB..."
          adb start-server || true
          ONLINE_DEVICES=$(adb devices | grep -w "device" | grep -v "List of devices" || true)

          if [ -z "$ONLINE_DEVICES" ]; then
            echo "No active emulator/device detected! Auto-booting Android Emulator..."
            TARGET_AVD=$(emulator -list-avds | head -n 1)
            if [ -z "$TARGET_AVD" ]; then
              echo "WARNING: No AVD found via 'emulator -list-avds'. Proceeding in case device attaches dynamically..."
            else
              echo "Launching AVD: $TARGET_AVD ..."
              nohup emulator -avd "$TARGET_AVD" -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
              echo "Waiting up to 180 seconds for emulator to finish booting..."
              adb wait-for-device
              for i in $(seq 1 60); do
                BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
                if [ "$BOOTED" = "1" ]; then
                  echo "Emulator boot completed!"
                  break
                fi
                sleep 3
              done
              sleep 5
              adb shell input keyevent 82 || true
              echo "Emulator unlocked and ready!"
            fi
          else
            echo "Active device/emulator already online:"
            echo "$ONLINE_DEVICES"
            adb shell input keyevent 82 || true
          fi

      - name: Run Appium and Maven Tests
        shell: bash
        run: |
          APK_VM_PATH="/opt/actions-runner-mobile/_work/Mobile_Automation_Testing/Mobile_Automation_Testing/app/app-uat-release.apk"

          echo "Cleaning any stale Appium process on port 4723..."
          fuser -k 4723/tcp 2>/dev/null || pkill -f "appium" 2>/dev/null || true

          echo "Starting Appium Server in background..."
          nohup npx appium --log appium_server.log > appium_stdout.log 2>&1 &
          APPIUM_PID=$!
          sleep 10

          echo "Executing Maven tests with APK path: $APK_VM_PATH"
          mvn clean test "-DappPath=$APK_VM_PATH" || true

          echo "Stopping Appium Server..."
          kill -9 $APPIUM_PID 2>/dev/null || true

      - name: Upload Test Reports & Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            target/extent-reports/
            target/surefire-reports/
            target/screenshots/
            appium_server.log

      - name: Parse TestNG Results and Send Teams Notification
        if: always()
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 - << 'EOF'
          import os, json, datetime, urllib.request
          import xml.etree.ElementTree as ET

          xml_path = "target/surefire-reports/testng-results.xml"
          passed = failed = skipped = total = 0
          duration_str = "N/A"
          suite_breakdown = "N/A"
          failure_details = "None"

          if os.path.exists(xml_path):
              tree = ET.parse(xml_path)
              root = tree.getroot()
              passed = int(root.attrib.get("passed", 0))
              failed = int(root.attrib.get("failed", 0))
              skipped = int(root.attrib.get("skipped", 0))
              total = int(root.attrib.get("total", 0))

              suite = root.find("suite")
              if suite is not None:
                  dur_ms = int(suite.attrib.get("duration-ms", 0))
                  if dur_ms > 0:
                      secs = dur_ms // 1000
                      duration_str = f"{secs // 60}m {secs % 60}s"

                  suite_lines = []
                  fail_list = []
                  for test in suite.findall("test"):
                      t_name = test.attrib.get("name", "Suite")
                      methods = [
                          m for c in test.findall("class")
                          for m in c.findall("test-method")
                          if m.attrib.get("is-config") != "true"
                      ]
                      t_pass = sum(1 for m in methods if m.attrib.get("status") == "PASS")
                      t_fail = sum(1 for m in methods if m.attrib.get("status") == "FAIL")
                      if methods:
                          suite_lines.append(f"{t_name} ({t_pass}/{len(methods)} passed, {t_fail} failed)")
                      for m in methods:
                          if m.attrib.get("status") == "FAIL":
                              m_name = m.attrib.get("name", "Test")
                              exc = m.find("exception/message")
                              msg = " ".join(exc.text.split())[:90] if (exc is not None and exc.text) else "Assertion/Timeout failure"
                              fail_list.append(f"- {m_name}: {msg}")

                  if suite_lines:
                      suite_breakdown = " | ".join(suite_lines)
                  if fail_list:
                      failure_details = "\n".join(fail_list)

          if failed == 0 and total > 0:
              status_label = "[PASSED] ALL TESTS PASSED"
          elif total == 0:
              status_label = "[WARNING] NO TESTS RAN"
          else:
              status_label = f"[FAILED] {failed} TEST(S) FAILED"

          card_body = [
              {
                  "type": "TextBlock",
                  "size": "Large",
                  "weight": "Bolder",
                  "text": f"Appium CI Report - {status_label}",
                  "wrap": True
              },
              {
                  "type": "FactSet",
                  "facts": [
                      {"title": "Environment", "value": "UAT (appium-vm)"},
                      {"title": "Suite Breakdown", "value": suite_breakdown},
                      {"title": "Total Tests", "value": str(total)},
                      {"title": "Passed", "value": str(passed)},
                      {"title": "Failed", "value": str(failed)},
                      {"title": "Skipped", "value": str(skipped)},
                      {"title": "Duration", "value": duration_str},
                      {"title": "Triggered by", "value": os.environ.get("ACTOR", "CI")},
                      {"title": "Date", "value": datetime.datetime.now().strftime("%Y-%m-%d %H:%M")}
                  ]
              }
          ]

          if failed > 0:
              card_body.append({"type": "TextBlock", "weight": "Bolder", "text": "Failed Test Details:", "wrap": True})
              card_body.append({"type": "TextBlock", "text": failure_details, "wrap": True})

          payload = {
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": card_body,
                      "actions": [{
                          "type": "Action.OpenUrl",
                          "title": "View Report, Screenshots and Failure Videos",
                          "url": os.environ.get("RUN_URL", "")
                      }]
                  }
              }]
          }

          webhook = os.environ.get("TEAMS_WEBHOOK_URL", "")
          if webhook:
              req = urllib.request.Request(
                  webhook,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST"
              )
              urllib.request.urlopen(req)
              print("Teams notification sent successfully!")
          EOF
