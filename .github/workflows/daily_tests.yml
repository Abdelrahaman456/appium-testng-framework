name: Daily Appium Mobile Tests

on:
  schedule:
    # Runs every day at 8:00 AM UTC (11:00 AM local time)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI anytime!

jobs:
  test:
    # macOS runners support KVM hardware acceleration for high-speed Android Emulators
    runs-on: macos-13

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install and Start Appium Server
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --log appium_server.log &
          sleep 5

      - name: Download / Prepare UAT APK
        run: |
          mkdir -p app
          # If your APK is stored in a URL (Firebase / AWS S3 / Internal Server), uncomment the line below:
          # curl -L "https://YOUR_COMPANY_STORAGE_URL/app-uat.apk" -o app/app-uat.apk
          echo "APK folder prepared at app/"

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Pixel 4
          script: mvn test -DappPath=app/app-uat.apk

      - name: Upload Test Reports & Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            target/surefire-reports/
            target/screenshots/
            appium_server.log
