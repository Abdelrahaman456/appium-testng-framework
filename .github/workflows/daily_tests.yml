name: Daily Appium Mobile Tests

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every day at 8:00 AM UTC (11:00 AM KSA / UTC+3)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Optional TestNG class/method filter (-Dtest=...), leave empty for full suite'
        required: false
        default: ''
      env:
        description: 'Target environment (uat or prod)'
        required: false
        default: 'uat'

# One emulator on the VM: never let two runs drive it at the same time.
concurrency:
  group: appium-vm-emulator
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 240
    # Linux test VM vm-cmn-appium-01 (GCP prj-cmn-platform-tree). It already runs:
    #   - Android emulator  (systemd: android-emulator@pixel_api34, API 34 Google Play x86_64, KVM)
    #   - Appium 2.19 + UiAutomator2 + Inspector plugin on 127.0.0.1:4723 (systemd: appium)
    # JDK 17, Maven 3.9.9, Android SDK and git-lfs are preinstalled; the runner sets
    # JAVA_HOME / ANDROID_HOME / M2_HOME / PATH.
    runs-on: [appium-vm]

    steps:
      - name: Checkout Repository Code (with LFS APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify or Download APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/app-uat-release.apk
          CACHE_APK=/tmp/app-uat-release.apk
          CACHE_META=/tmp/app-uat-release.meta
          mkdir -p app

          ASSET_INFO=$(python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "TreeDigitalInsurance/Mobile_Automation_Testing")
          token = os.environ.get("GH_TOKEN", "")
          url = f"https://api.github.com/repos/{repo}/releases/tags/uat-apk"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  rel = json.loads(resp.read().decode("utf-8"))
              assets = rel.get("assets", [])
              picked = next((a for a in assets if a.get("name") == "app-uat-release.apk"), None)
              if not picked:
                  picked = next((a for a in assets if str(a.get("name", "")).endswith(".apk")), None)
              if picked:
                  print(f"{picked['id']}|{picked.get('updated_at','')}|{picked.get('size',0)}|{picked['url']}")
          except Exception as e:
              print(f"ERR|{e}")
          PY
          )

          if [[ "$ASSET_INFO" != ERR\|* ]] && [ -n "$ASSET_INFO" ]; then
            IFS='|' read -r ASSET_ID ASSET_UPDATED ASSET_SIZE ASSET_API_URL <<< "$ASSET_INFO"
            REMOTE_META="${ASSET_ID}:${ASSET_UPDATED}:${ASSET_SIZE}"
            CACHED_META=$(cat "$CACHE_META" 2>/dev/null || true)

            if [ -f "$CACHE_APK" ] && [ "$(stat -c %s "$CACHE_APK" 2>/dev/null || echo 0)" -gt 1000000 ] && [ "$CACHED_META" = "$REMOTE_META" ] && unzip -tq "$CACHE_APK" >/dev/null 2>&1; then
              echo "Using up-to-date cached APK ($CACHE_META)..."
              cp -f "$CACHE_APK" "$APK"
            else
              echo "Downloading latest uat-apk asset (id=$ASSET_ID updated=$ASSET_UPDATED size=$ASSET_SIZE)..."
              rm -f "$APK.tmp"
              curl -fSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$ASSET_API_URL" -o "$APK.tmp" || true
              if [ -f "$APK.tmp" ] && [ "$(stat -c %s "$APK.tmp" 2>/dev/null || echo 0)" -gt 1000000 ] && unzip -tq "$APK.tmp" >/dev/null 2>&1; then
                mv -f "$APK.tmp" "$APK"
                cp -f "$APK" "$CACHE_APK" 2>/dev/null || true
                echo "$REMOTE_META" > "$CACHE_META" 2>/dev/null || true
              else
                rm -f "$APK.tmp"
              fi
            fi
          else
            echo "uat-apk release lookup unavailable ($ASSET_INFO); checking local/cached APK..."
          fi

          if [ ! -f "$APK" ] && [ -f "$CACHE_APK" ] && [ "$(stat -c %s "$CACHE_APK" 2>/dev/null || echo 0)" -gt 1000000 ]; then
            echo "Falling back to cached APK at $CACHE_APK..."
            cp -f "$CACHE_APK" "$APK"
          fi

          if [ -f "$APK" ] && [ "$(stat -c %s "$APK" 2>/dev/null || echo 0)" -gt 1000000 ] && unzip -tq "$APK" >/dev/null 2>&1; then
            echo "Valid APK verified ($(stat -c %s "$APK") bytes)."
            echo "HAVE_APK=true" >> $GITHUB_ENV
          else
            echo "APK not found as standalone file; verifying pre-installed app on device..."
            echo "HAVE_APK=false" >> $GITHUB_ENV
          fi

      - name: Show toolchain
        run: |
          java -version 2>&1 | head -1
          mvn -version | head -1
          adb version | head -1
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || true)
          echo "COMMIT_MESSAGE=${COMMIT_MSG}" >> $GITHUB_ENV

      - name: Ensure Android Emulator is Booted and Healthy
        run: |
          echo "Checking connected Android devices via ADB..."
          adb start-server >/dev/null 2>&1 || true
          DEV=""
          for i in $(seq 1 36); do
            DEV=$(adb devices | awk 'NR>1 && $2=="device" {print $1}' | head -1)
            [ -n "$DEV" ] && break
            sleep 5
          done
          if [ -z "$DEV" ]; then
            echo "::error::No online emulator. On the VM: sudo systemctl restart android-emulator@pixel_api34"
            adb devices
            exit 1
          fi
          echo "Device online: $DEV"
          for i in $(seq 1 60); do
            [ "$(adb -s "$DEV" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 3
          done
          adb -s "$DEV" shell input keyevent 82 || true
          adb -s "$DEV" shell settings put global window_animation_scale 1 || true
          adb -s "$DEV" shell settings put global transition_animation_scale 1 || true
          adb -s "$DEV" shell settings put global animator_duration_scale 1 || true
          adb -s "$DEV" shell am force-stop io.appium.uiautomator2.server || true
          adb -s "$DEV" shell am force-stop io.appium.uiautomator2.server.test || true
          ANDROID_VER=$(adb -s "$DEV" shell getprop ro.build.version.release | tr -d '\r')
          DEV_MODEL=$(adb -s "$DEV" shell getprop ro.product.model | tr -d '\r')
          echo "Emulator ready: $DEV_MODEL Android $ANDROID_VER"
          echo "DEVICE_INFO=${DEV_MODEL:-Android Emulator} (Android ${ANDROID_VER:-14}, ${DEV})" >> $GITHUB_ENV

          TARGET_ENV="${{ inputs.env || 'uat' }}"
          PKG="sa.com.tree.digital.insurance.uat"
          if [ "$TARGET_ENV" = "prod" ]; then
            PKG="sa.com.tree.digital.insurance"
          fi
          if [ "$TARGET_ENV" = "uat" ] && [ "${HAVE_APK:-false}" = "true" ] && [ -f "app/app-uat-release.apk" ]; then
            APK_SHA=$(sha256sum app/app-uat-release.apk | awk '{print $1}')
            INSTALLED_SHA=$(cat /tmp/app-uat-release.installed.sha 2>/dev/null || true)
            INSTALLED_PATH=$(adb -s "$DEV" shell pm path "$PKG" 2>/dev/null | tr -d '\r' || true)
            if [ -z "$INSTALLED_PATH" ] || [ "$INSTALLED_SHA" != "$APK_SHA" ]; then
              echo "Installing latest UAT APK onto $DEV (sha256=${APK_SHA:0:12})..."
              if ! adb -s "$DEV" install -r -d -g app/app-uat-release.apk; then
                echo "Upgrade install failed (e.g. signature mismatch); uninstalling old $PKG and clean-installing..."
                adb -s "$DEV" uninstall "$PKG" || true
                adb -s "$DEV" install -g app/app-uat-release.apk
              fi
              echo "$APK_SHA" > /tmp/app-uat-release.installed.sha
            else
              echo "Latest UAT APK already installed on $DEV (sha256=${APK_SHA:0:12})."
            fi
          fi
          APP_VER=$(adb -s "$DEV" shell dumpsys package "$PKG" 2>/dev/null | grep -m1 "versionName=" | sed 's/.*versionName=//' | tr -d '\r' || true)
          APP_CODE=$(adb -s "$DEV" shell dumpsys package "$PKG" 2>/dev/null | grep -m1 "versionCode=" | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | tr -d '\r' || true)
          echo "Installed app: $PKG version=${APP_VER:-unknown} code=${APP_CODE:-unknown}"
          echo "APP_VERSION=${APP_VER:-$PKG}" >> $GITHUB_ENV

          # Clear stale app session/token state before each CI run and re-grant runtime permissions
          echo "Clearing stale app data for $PKG and re-granting runtime permissions..."
          adb -s "$DEV" shell pm clear "$PKG" || true
          for PERM in android.permission.POST_NOTIFICATIONS android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION android.permission.CAMERA android.permission.READ_MEDIA_IMAGES; do
            adb -s "$DEV" shell pm grant "$PKG" "$PERM" 2>/dev/null || true
          done
          echo "=== CI VM & Emulator Network / Environment Diagnostics ==="
          echo "VM Date (UTC): $(date -u)"
          echo "VM Egress IP/Geo: $(curl -sS --max-time 5 https://ipinfo.io/json 2>/dev/null | tr '\n' ' ' || echo 'unavailable')"
          echo "Emulator Timezone: $(adb -s "$DEV" shell getprop persist.sys.timezone 2>/dev/null | tr -d '\r')"
          echo "Emulator Date: $(adb -s "$DEV" shell date -u 2>/dev/null | tr -d '\r')"
          echo "Emulator DNS1: $(adb -s "$DEV" shell getprop net.dns1 2>/dev/null | tr -d '\r')"
          echo "Emulator HTTP Proxy: $(adb -s "$DEV" shell settings get global http_proxy 2>/dev/null | tr -d '\r')"

      - name: Ensure Appium server is up
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4723/status >/dev/null; then
              curl -s http://127.0.0.1:4723/status; echo
              exit 0
            fi
            sleep 3
          done
          echo "::error::Appium is not answering on 127.0.0.1:4723. On the VM: sudo systemctl restart appium"
          exit 1

      - name: Run Maven Tests
        id: maven
        run: |
          # Remember where the shared Appium log is, so only this run's lines are archived.
          (wc -l < /var/log/appium/appium.log || echo 0) > .appium_log_start 2>/dev/null
          DEV=$(adb devices | awk 'NR>1 && $2=="device" {print $1}' | head -1)
          [ -n "$DEV" ] && adb -s "$DEV" logcat -c 2>/dev/null || true
          TARGET_ENV="${{ inputs.env || 'uat' }}"
          TEST_FILTER="${{ inputs.test_filter || '' }}"
          # Note: APK is pre-installed on the emulator above; omit -DappPath so Appium attaches via appPackage/appActivity in ~2s instead of re-pushing 290 MB on session creation.
          MVN_ARGS="-B clean test -Denv=${TARGET_ENV}"
          if [ -n "$TEST_FILTER" ]; then
            MVN_ARGS="$MVN_ARGS -Dtest=${TEST_FILTER}"
          fi
          mvn $MVN_ARGS

      - name: Collect Appium & Android logcat logs for this run
        if: always()
        run: |
          START=$(cat .appium_log_start 2>/dev/null || echo 0)
          tail -n +"$((START + 1))" /var/log/appium/appium.log > appium_server.log 2>/dev/null || true
          echo "appium_server.log: $(wc -l < appium_server.log) lines"
          DEV=$(adb devices | awk 'NR>1 && $2=="device" {print $1}' | head -1)
          if [ -n "$DEV" ]; then
            adb -s "$DEV" logcat -d -v time > android_logcat.log 2>/dev/null || true
            echo "android_logcat.log: $(wc -l < android_logcat.log) lines"
            echo "=== Key Flutter / App / Network / Activity logcat lines (last 100) ==="
            grep -iE "flutter|AndroidRuntime|FATAL|DioException|HandshakeException|Certificate|SSL|401|403|MainActivity|sa\.com\.tree|ActivityTaskManager|Force stopping|WIN DEATH|Process.*died" android_logcat.log | tail -n 100 || true
          fi

      - name: Build Daily Teams Report & Bug Triage
        if: always()
        env:
          APP_ENV: ${{ inputs.env || 'uat' }}
          TEAMS_CHANNEL_NAME: Mobile Automation
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          ACTOR: ${{ github.actor }}
          MAVEN_OUTCOME: ${{ steps.maven.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/send_teams_report.py --dry-run

      - name: Upload Test Reports & Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            target/extent-reports/
            target/surefire-reports/
            target/perf-reports/
            target/teams-report/
            target/screenshots/
            target/videos/
            appium_server.log
            android_logcat.log

      - name: Send Microsoft Teams Notification (Mobile Automation Channel)
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          APP_ENV: ${{ inputs.env || 'uat' }}
          TEAMS_CHANNEL_NAME: Mobile Automation
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          ACTOR: ${{ github.actor }}
          MAVEN_OUTCOME: ${{ steps.maven.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/send_teams_report.py
