name: Daily Appium Mobile Tests

on:
  schedule:
    # Runs every day at 8:00 AM UTC (11:00 AM local time)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI anytime!

jobs:
  test:
    timeout-minutes: 20
    runs-on: self-hosted # <--- This tells GitHub to ping your local machine!

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Just to be safe)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Appium Server (Background)
        run: |
          echo "Starting Appium Server locally..."
          Start-Process -NoNewWindow -FilePath "appium" -ArgumentList "--log appium_server.log"
          Start-Sleep -Seconds 5
        shell: powershell

      - name: Run Appium Tests
        run: |
          echo "Executing Maven tests..."
          mvn clean test
        shell: powershell

      - name: Upload Test Reports & Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            target/extent-reports/
            target/surefire-reports/
            target/screenshots/
            appium_server.log
