name: Daily Appium Mobile Tests

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every day at 8:00 AM UTC (11:00 AM local time)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI anytime!

# One emulator on the VM: never let two runs drive it at the same time.
concurrency:
  group: appium-vm-emulator
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 90
    # Linux test VM vm-cmn-appium-01 (GCP prj-cmn-platform-tree). It already runs:
    #   - Android emulator  (systemd: android-emulator@pixel_api34, API 34 Google Play x86_64, KVM)
    #   - Appium 2.19 + UiAutomator2 + Inspector plugin on 127.0.0.1:4723 (systemd: appium)
    # JDK 17, Maven 3.9.9, Android SDK and git-lfs are preinstalled; the runner sets
    # JAVA_HOME / ANDROID_HOME / M2_HOME / PATH.
    runs-on: [appium-vm]

    steps:
      - name: Checkout Repository Code (with LFS APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify or Download APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/app-uat-release.apk
          mkdir -p app

          # If real APK is already in runner workspace or cached on VM, use it
          if [ -f "$APK" ] && [ $(stat -c %s "$APK" 2>/dev/null || echo 0) -gt 1000000 ]; then
            echo "Real APK already present at $APK ($(stat -c %s "$APK") bytes)"
          elif [ -f "/tmp/app-uat-release.apk" ] && [ $(stat -c %s "/tmp/app-uat-release.apk" 2>/dev/null || echo 0) -gt 1000000 ]; then
            echo "Copying cached APK from /tmp/app-uat-release.apk to $APK..."
            cp -f /tmp/app-uat-release.apk "$APK"
          else
            echo "Attempting to download APK from GitHub release uat-apk..."
            curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "https://github.com/TreeDigitalInsurance/Mobile_Automation_Testing/releases/download/uat-apk/app-uat-release.apk" \
              -o "$APK" || true
          fi

          if [ -f "$APK" ] && [ $(stat -c %s "$APK" 2>/dev/null || echo 0) -gt 1000000 ] && unzip -tq "$APK" >/dev/null 2>&1; then
            echo "Valid APK verified ($(stat -c %s "$APK") bytes)."
            cp -f "$APK" /tmp/app-uat-release.apk 2>/dev/null || true
            echo "HAVE_APK=true" >> $GITHUB_ENV
          else
            echo "APK not found as standalone file; verifying pre-installed app on device..."
            echo "HAVE_APK=false" >> $GITHUB_ENV
          fi

      - name: Show toolchain
        run: |
          java -version 2>&1 | head -1
          mvn -version | head -1
          adb version | head -1

      - name: Ensure Android Emulator is Booted and Healthy
        run: |
          echo "Checking connected Android devices via ADB..."
          adb start-server >/dev/null 2>&1 || true
          DEV=""
          for i in $(seq 1 36); do
            DEV=$(adb devices | awk 'NR>1 && $2=="device" {print $1}' | head -1)
            [ -n "$DEV" ] && break
            sleep 5
          done
          if [ -z "$DEV" ]; then
            echo "::error::No online emulator. On the VM: sudo systemctl restart android-emulator@pixel_api34"
            adb devices
            exit 1
          fi
          echo "Device online: $DEV"
          for i in $(seq 1 60); do
            [ "$(adb -s "$DEV" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 3
          done
          adb -s "$DEV" shell input keyevent 82 || true
          echo "Emulator ready: Android $(adb -s "$DEV" shell getprop ro.build.version.release | tr -d '\r')"

      - name: Ensure Appium server is up
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4723/status >/dev/null; then
              curl -s http://127.0.0.1:4723/status; echo
              exit 0
            fi
            sleep 3
          done
          echo "::error::Appium is not answering on 127.0.0.1:4723. On the VM: sudo systemctl restart appium"
          exit 1

      - name: Run Maven Tests
        run: |
          # Remember where the shared Appium log is, so only this run's lines are archived.
          (wc -l < /var/log/appium/appium.log || echo 0) > .appium_log_start 2>/dev/null
          if [ "$HAVE_APK" = "true" ]; then
            mvn -B clean test "-DappPath=${GITHUB_WORKSPACE}/app/app-uat-release.apk"
          else
            mvn -B clean test
          fi

      - name: Collect Appium server log for this run
        if: always()
        run: |
          START=$(cat .appium_log_start 2>/dev/null || echo 0)
          tail -n +"$((START + 1))" /var/log/appium/appium.log > appium_server.log 2>/dev/null || true
          echo "appium_server.log: $(wc -l < appium_server.log) lines"

      - name: Upload Test Reports & Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            target/extent-reports/
            target/surefire-reports/
            target/screenshots/
            appium_server.log

      - name: Parse TestNG Results and Send Teams Notification
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        shell: python3 {0}
        run: |
          import json, os, re, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          passed = failed = skipped = total = 0
          duration_str, suite_breakdown, failure_details = "N/A", "N/A", "None"

          xml_path = "target/surefire-reports/testng-results.xml"
          if os.path.exists(xml_path):
              root = ET.parse(xml_path).getroot()
              passed, failed = int(root.get("passed", 0)), int(root.get("failed", 0))
              skipped, total = int(root.get("skipped", 0)), int(root.get("total", 0))

              suite = root.find("suite")
              duration_ms = int(suite.get("duration-ms", 0)) if suite is not None else 0
              if duration_ms > 0:
                  secs = duration_ms // 1000
                  duration_str = f"{secs // 60}m {secs % 60}s"

              # Per-suite breakdown (Motor vs Travel)
              lines = []
              for t in root.iter("test"):
                  methods = [m for m in t.iter("test-method") if m.get("is-config") != "true"]
                  if methods:
                      t_pass = sum(1 for m in methods if m.get("status") == "PASS")
                      t_fail = sum(1 for m in methods if m.get("status") == "FAIL")
                      lines.append(f"{t.get('name')} ({t_pass}/{len(methods)} passed, {t_fail} failed)")
              if lines:
                  suite_breakdown = " | ".join(lines)

              # Failed test names and short error messages
              fails = []
              for m in root.iter("test-method"):
                  if m.get("status") == "FAIL" and m.get("is-config") != "true":
                      msg_el = m.find("exception/message")
                      raw = re.sub(r"\s+", " ", (msg_el.text or "") if msg_el is not None else "").strip()
                      short = raw[:90] + "..." if len(raw) > 90 else raw
                      fails.append(f"- {m.get('name')} : {short}")
              if fails:
                  failure_details = "\n".join(fails)

          if failed == 0 and total > 0:
              status = "[PASSED] ALL TESTS PASSED"
          elif total == 0:
              status = "[WARNING] NO TESTS RAN"
          else:
              status = f"[FAILED] {failed} TEST(S) FAILED"

          facts = [
              ("Environment", "UAT"), ("Suite Breakdown", suite_breakdown),
              ("Total Tests", total), ("Passed", passed), ("Failed", failed),
              ("Skipped", skipped), ("Duration", duration_str),
              ("Triggered by", os.environ.get("ACTOR", "")),
              ("Date", datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M") + " UTC"),
          ]
          body = [
              {"type": "TextBlock", "size": "Large", "weight": "Bolder",
               "text": f"Appium CI Report - {status}", "wrap": True},
              {"type": "FactSet", "facts": [{"title": k, "value": str(v)} for k, v in facts]},
          ]
          if failed > 0:
              body.append({"type": "TextBlock", "weight": "Bolder", "text": "Failed Test Details:", "wrap": True})
              body.append({"type": "TextBlock", "text": failure_details, "wrap": True})

          payload = {
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                      "type": "AdaptiveCard", "version": "1.4", "body": body,
                      "actions": [{"type": "Action.OpenUrl",
                                   "title": "View Report, Screenshots and Failure Videos",
                                   "url": os.environ.get("RUN_URL", "")}],
                  },
              }],
          }

          url = os.environ.get("TEAMS_WEBHOOK_URL", "")
          if not url:
              print("TEAMS_WEBHOOK_URL not set; skipping notification")
          else:
              try:
                  req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"),
                                               headers={"Content-Type": "application/json; charset=utf-8"})
                  urllib.request.urlopen(req, timeout=30)
                  print("Teams notification sent successfully!")
              except Exception as e:
                  print(f"Teams notification failed: {e}")
