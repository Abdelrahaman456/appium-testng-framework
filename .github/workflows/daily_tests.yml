name: Daily Appium Mobile Tests

on:
  schedule:
    # Runs every day at 8:00 AM UTC (11:00 AM local time)
    - cron: '0 8 * * *'
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI anytime!

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            nohup appium --log appium_server.log > /dev/null 2>&1 &
            sleep 10
            mvn test -DappPath=app/app-uat-release.apk -DtestFailureIgnore=true

      - name: Upload Test Reports & Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            target/extent-reports/
            target/surefire-reports/
            target/screenshots/
            appium_server.log
