name: Daily Appium Mobile Tests

on:
  schedule:
    # Runs every day at 8:00 AM UTC (11:00 AM local time)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI anytime!

jobs:
  test:
    timeout-minutes: 90
    runs-on: self-hosted # <--- This tells GitHub to ping your local machine!

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Copy Local APK to Runner (Bypass LFS Download)
        run: |
          Copy-Item -Path "C:\Users\LENOVO\Downloads\appium-testng-framework\app\app-uat-release.apk" -Destination "app\app-uat-release.apk" -Force
        shell: powershell

      - name: Set up JDK 17 (Just to be safe)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Run Appium and Maven Tests
        run: |
          echo "Starting Appium Server locally via npx..."
          Start-Process -FilePath "npx.cmd" -ArgumentList "appium --log appium_server.log" -WindowStyle Hidden
          Start-Sleep -Seconds 10
          echo "Executing Maven tests..."
          mvn clean test "-DappPath=app/app-uat-release.apk"
        shell: powershell

      - name: Upload Test Reports & Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            target/extent-reports/
            target/surefire-reports/
            target/screenshots/
            appium_server.log

      - name: Parse TestNG Results
        if: always()
        id: results
        shell: powershell
        run: |
          $passed  = 0
          $failed  = 0
          $skipped = 0
          $total   = 0
          $xmlPath = "target\surefire-reports\testng-results.xml"
          if (Test-Path $xmlPath) {
            [xml]$xml = Get-Content $xmlPath
            $passed  = [int]$xml.'testng-results'.passed
            $failed  = [int]$xml.'testng-results'.failed
            $skipped = [int]$xml.'testng-results'.skipped
            $total   = [int]$xml.'testng-results'.total
          }
          echo "passed=$passed"   >> $env:GITHUB_OUTPUT
          echo "failed=$failed"   >> $env:GITHUB_OUTPUT
          echo "skipped=$skipped" >> $env:GITHUB_OUTPUT
          echo "total=$total"     >> $env:GITHUB_OUTPUT
          Write-Host "Results -> Passed: $passed | Failed: $failed | Skipped: $skipped | Total: $total"

      - name: Send Teams Notification
        if: always()
        shell: powershell
        run: |
          $passed   = "${{ steps.results.outputs.passed }}"
          $failed   = "${{ steps.results.outputs.failed }}"
          $skipped  = "${{ steps.results.outputs.skipped }}"
          $total    = "${{ steps.results.outputs.total }}"
          $runUrl   = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $actor    = "${{ github.actor }}"
          $date     = (Get-Date -Format "yyyy-MM-dd HH:mm")

          if ($failed -eq "0" -and $total -ne "0") {
            $statusLabel = "[PASSED] ALL TESTS PASSED"
            $cardColor   = "Good"
          } elseif ($total -eq "0") {
            $statusLabel = "[WARNING] NO TESTS RAN"
            $cardColor   = "Warning"
          } else {
            $statusLabel = "[FAILED] $failed TEST(S) FAILED"
            $cardColor   = "Attention"
          }

          $bodyObj = [ordered]@{
            type = "message"
            attachments = @(
              [ordered]@{
                contentType = "application/vnd.microsoft.card.adaptive"
                content = [ordered]@{
                  type    = "AdaptiveCard"
                  version = "1.4"
                  body    = @(
                    [ordered]@{
                      type   = "TextBlock"
                      size   = "Large"
                      weight = "Bolder"
                      text   = "Appium CI Report - $statusLabel"
                      wrap   = $true
                    }
                    [ordered]@{
                      type = "FactSet"
                      facts = @(
                        [ordered]@{ title = "Environment";  value = "UAT" }
                        [ordered]@{ title = "Total Tests";  value = "$total" }
                        [ordered]@{ title = "Passed";       value = "$passed" }
                        [ordered]@{ title = "Failed";       value = "$failed" }
                        [ordered]@{ title = "Skipped";      value = "$skipped" }
                        [ordered]@{ title = "Triggered by"; value = "$actor" }
                        [ordered]@{ title = "Date";         value = "$date" }
                      )
                    }
                  )
                  actions = @(
                    [ordered]@{
                      type  = "Action.OpenUrl"
                      title = "View Report and Artifacts"
                      url   = "$runUrl"
                    }
                  )
                }
              }
            )
          }

          $body = $bodyObj | ConvertTo-Json -Depth 15

          try {
            Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -Body $body -ContentType "application/json; charset=utf-8"
            Write-Host "Teams notification sent successfully!"
          } catch {
            Write-Host "Teams notification failed: $($_.Exception.Message)"
          }

