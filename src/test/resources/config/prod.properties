# ============================================================
# PRODUCTION Environment Configuration
# Target: Tree Digital Insurance PROD (Live Production App)
# Activate: mvn test -Denv=prod
#
# ⚠️  WARNING: This runs against LIVE production data!
#     Use ONLY approved prod test accounts.
#     NEVER use real customer national IDs or payment cards.
# ============================================================

# --- App Settings ---
app.env.name=PRODUCTION
app.package=sa.com.tree.digital.insurance
app.activity=sa.com.tree.digital.insurance.MainActivity
app.path=app/app-prod-release.apk

# --- Appium Server ---
appium.server.url=http://127.0.0.1:4723

# --- Customer Data (PROD Approved Test Accounts Only) ---
# ⚠️  Replace with approved PROD QA test account credentials before running!
default.phone=500000001
default.otp=1234
default.email=qa-prod@tree.com.sa
default.iban=SA0000000000000000000000

# --- Vehicle Data (PROD Registered QA Test Vehicles) ---
# ⚠️  Replace with real vehicles registered in PROD for QA purposes!
default.sequence.number=000000001
default.custom.card=0000000001
default.seller.id=0000000001
default.car.year=2024

# --- Payment Card Data (PROD QA Test Cards) ---
# ⚠️  Use ONLY approved QA sandbox-approved cards, NOT real payment cards!
default.card.number=4111111111111111
default.card.expiry=12/2030
default.card.cvv=123
default.card.holder=Tree Prod QA

# --- ID Generator Prefixes ---
# Use different prefix range in PROD to avoid overlap with UAT generated IDs
national.id.prefix=135455
sequence.number.prefix=70485

# --- Timeouts (seconds) ---
# PROD typically requires longer timeouts due to real backend processing
timeout.element.visible=15
timeout.payment.processing=45
timeout.policy.confirmation=45

# --- Target Device ---
default.target.device=Physical Android Device (PROD)
