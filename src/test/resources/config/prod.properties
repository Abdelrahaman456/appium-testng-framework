# ============================================================
# PRODUCTION Environment Configuration
# Target: Tree Digital Insurance PROD (Live Production App)
# Activate: mvn test -Denv=prod -DsuiteXmlFile=src/test/resources/testng-prod.xml
#
# ⚠️  SAFETY: prod.skip.payment=true ensures Production tests
#     verify journeys up to Quote / Plan Selection and NEVER
#     click Pay now or issue live policies.
# ============================================================

# --- App Settings ---
app.env.name=PROD
app.package=sa.com.tree.digital.insurance
app.activity=sa.com.tree.digital.insurance.MainActivity
app.path=

# --- Appium Server ---
appium.server.url=http://127.0.0.1:4723

# --- Safety Guard ---
prod.skip.payment=true

# --- Approved Production QA Identity Data ---
default.national.id=1102126107
default.sequence.number=419283710
default.phone=590005585
default.otp=1234
default.dob.year=1999
default.dob.month=Jan
default.email=aashraf@tree.com.sa
default.iban=SA6530400108071059170014

# --- Vehicle Data ---
default.custom.card=0000000001
default.seller.id=1102126107
default.car.year=2026

# --- Payment Card Data (blocked by prod.skip.payment=true) ---
default.card.number=4111111111111111
default.card.expiry=12/2026
default.card.cvv=911
default.card.holder=Tree Prod QA

# --- ID Generator Prefixes (unused in PROD when default.national.id / sequence.number are set) ---
national.id.prefix=110212
sequence.number.prefix=41928

# --- Timeouts (seconds) ---
timeout.element.visible=15
timeout.payment.processing=45
timeout.policy.confirmation=45

# --- Target Device ---
default.target.device=Android Emulator (PROD)
record.video=false
